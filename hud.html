<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentra AI · HUD</title>
<style>
  :root {
    --bg: #070b10;
    --panel: #0b1219;
    --cyan: #00e5ff;
    --text: #cfe8ef;
    --muted: #6b7c86;
    --alert: #ffb300;
    --border: #14424f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .logo { font-size: 1.4rem; font-weight: bold; letter-spacing: 2px; color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,0.4); }
  .badge { font-size: 0.75rem; color: var(--alert); border: 1px solid var(--alert); padding: 2px 8px; border-radius: 4px; margin-left: 10px; }
  .stats { display: flex; gap: 15px; font-size: 0.85rem; color: var(--muted); align-items: center; }
  .stat-val { color: var(--cyan); font-weight: bold; }
  
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } .canvas-col { display: none; } }

  .canvas-col { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
  canvas { width: 100%; max-width: 440px; height: 380px; }
  .status-label { font-size: 1.1rem; letter-spacing: 3px; color: var(--cyan); margin-top: 10px; text-transform: uppercase; }

  .chat-col { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  #chat { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 14px; border-radius: 6px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
  .msg-tu { align-self: flex-end; background: #1b2a35; color: #fff; border-left: 3px solid var(--cyan); }
  .msg-ai { align-self: flex-start; background: #0c1822; color: var(--text); border-left: 3px solid var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,0.15); }
  .msg-sis { align-self: center; font-size: 0.8rem; color: var(--muted); font-style: italic; }

  #confirm-banner { display: none; background: #2a1a05; border: 1px solid var(--alert); color: #ffcf66; padding: 10px; margin: 10px; border-radius: 6px; justify-content: space-between; align-items: center; }
  #confirm-banner button { margin-left: 8px; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .btn-yes { background: var(--alert); color: #000; }
  .btn-no { background: #443015; color: #ffcf66; }

  footer { padding: 12px 15px; background: var(--panel); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .controls { display: flex; gap: 8px; }
  input[type="text"] { flex: 1; background: #070b10; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 1rem; outline: none; }
  input[type="text"]:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,0.3); }
  button.action-btn { background: var(--panel); border: 1px solid var(--border); color: var(--cyan); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s; }
  button.action-btn:hover { background: rgba(0,229,255,0.15); border-color: var(--cyan); }
  button.action-btn.active { background: var(--cyan); color: #000; }
  .quick-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .chip { background: #070b10; border: 1px solid #16313b; color: var(--muted); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
  .chip:hover { color: var(--text); border-color: var(--cyan); }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;">
    <div class="logo" id="hud-title">SENTRA AI</div>
    <span class="badge">HUD LOCAL</span>
  </div>
  <div class="stats">
    <div>CPU: <span class="stat-val" id="cpu-val">0%</span></div>
    <div>RAM: <span class="stat-val" id="ram-val">0%</span></div>
    <div>VOL: <span class="stat-val" id="vol-val">50%</span></div>
  </div>
</header>

<main>
  <div class="canvas-col">
    <canvas id="coreCanvas" width="440" height="380"></canvas>
    <div class="status-label" id="status-label">EN LÍNEA</div>
  </div>
  <div class="chat-col">
    <div id="confirm-banner">
      <span id="confirm-text">Acción pendiente...</span>
      <div>
        <button class="btn-yes" onclick="confirmar(true)">CONFIRMAR</button>
        <button class="btn-no" onclick="confirmar(false)">CANCELAR</button>
      </div>
    </div>
    <div id="chat">
      <div class="msg msg-sis">Sistemas inicializados. Esperando instrucciones...</div>
    </div>
  </div>
</main>

<footer>
  <div class="quick-chips">
    <span class="chip" onclick="enviarTexto('¿Qué hora es?')">¿Qué hora es?</span>
    <span class="chip" onclick="enviarTexto('Estado de mi PC')">Estado de mi PC</span>
    <span class="chip" onclick="enviarTexto('Abre YouTube')">Abre YouTube</span>
    <span class="chip" onclick="enviarTexto('Sube el volumen')">Sube el volumen</span>
    <span class="chip" onclick="enviarTexto('Modo Iron Man')">Modo Iron Man</span>
    <span class="chip" onclick="enviarTexto('¿Cómo está el clima?')">Clima</span>
  </div>
  <div class="controls">
    <input type="text" id="promptInput" placeholder="Escribe tu orden para Sentra..." autocomplete="off">
    <button class="action-btn" onclick="enviarPrompt()">ENVIAR</button>
    <button class="action-btn" id="btn-escucha" onclick="toggleEscucha()">ESCUCHA: OFF</button>
    <button class="action-btn" id="btn-voz" onclick="toggleVoz()">VOZ: SÍ</button>
  </div>
</footer>

<script>
const params = new URLSearchParams(window.location.search);
const TOKEN = params.get('k') || '';
let ultId = 0;
let estadoActual = { estado: 'listo', voz: true, escucha: false, color: '#00e5ff' };

async function api(ruta, datos = null) {
  const opts = {
    method: datos ? 'POST' : 'GET',
    headers: { 'X-K': TOKEN, 'Content-Type': 'application/json' }
  };
  if (datos) opts.body = JSON.stringify(datos);
  try {
    const res = await fetch(ruta + (datos ? '' : (ruta.includes('?') ? '&' : '?') + 'k=' + TOKEN), opts);
    return await res.json();
  } catch(e) { return null; }
}

async function refrescar() {
  const d = await api('/api/estado?desde=' + ultId);
  if (!d) return;
  estadoActual = d;
  document.getElementById('cpu-val').innerText = (d.cpu || 0) + '%';
  document.getElementById('ram-val').innerText = (d.ram || 0) + '%';
  document.getElementById('vol-val').innerText = (d.vol || 50) + '%';
  document.getElementById('status-label').innerText = (d.estado || 'listo').toUpperCase();
  document.getElementById('hud-title').innerText = (d.nombre || 'SENTRA AI').toUpperCase();
  document.getElementById('btn-voz').innerText = 'VOZ: ' + (d.voz ? 'SÍ' : 'NO');
  document.getElementById('btn-escucha').innerText = 'ESCUCHA: ' + (d.escucha ? 'ON' : 'OFF');

  const banner = document.getElementById('confirm-banner');
  if (d.pendiente) {
    document.getElementById('confirm-text').innerText = 'Confirmar: ' + d.pendiente;
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }

  if (d.eventos && d.eventos.length) {
    const chat = document.getElementById('chat');
    for (const ev of d.eventos) {
      if (ev.id > ultId) ultId = ev.id;
      const el = document.createElement('div');
      el.className = 'msg ' + (ev.q === 'tú' ? 'msg-tu' : (ev.q === 'sis' ? 'msg-sis' : 'msg-ai'));
      el.innerText = (ev.q === 'tú' ? 'Tú: ' : (ev.q === 'sentra ai' ? (d.nombre || 'Sentra') + ': ' : '')) + ev.t;
      chat.appendChild(el);
    }
    chat.scrollTop = chat.scrollHeight;
  }
}

async function enviarTexto(t) {
  if (!t) return;
  await api('/api/chat', { texto: t });
  setTimeout(refrescar, 200);
}

function enviarPrompt() {
  const inp = document.getElementById('promptInput');
  const t = inp.value.trim();
  if (t) {
    enviarTexto(t);
    inp.value = '';
  }
}

document.getElementById('promptInput').onkeypress = (e) => { if (e.key === 'Enter') enviarPrompt(); };

async function toggleEscucha() {
  await api('/api/escucha', { on: !estadoActual.escucha });
  refrescar();
}

async function toggleVoz() {
  await api('/api/voz', { on: !estadoActual.voz });
  refrescar();
}

async function confirmar(ok) {
  await api('/api/confirmar', { ok: ok });
  refrescar();
}

// Reactor Canvas Animation
const cv = document.getElementById('coreCanvas');
const ctx = cv.getContext('2d');
let fase = 0;
function animar() {
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2, r = 70;
  const col = estadoActual.color || '#00e5ff';
  fase += 0.03 * (estadoActual.estado === 'pensando' ? 3 : 1);

  ctx.save();
  ctx.translate(cx, cy);

  // Anillos concéntricos
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(0, 0, r + i * 22, fase * (i % 2 === 0 ? 1 : -1), fase * (i % 2 === 0 ? 1 : -1) + Math.PI * 1.5);
    ctx.strokeStyle = col;
    ctx.lineWidth = 3 - i * 0.8;
    ctx.shadowBlur = 10;
    ctx.shadowColor = col;
    ctx.stroke();
  }

  // Núcleo central palpitante
  const pulse = Math.sin(fase * 2) * 5;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.45 + pulse, 0, Math.PI * 2);
  ctx.fillStyle = col;
  ctx.shadowBlur = 20;
  ctx.shadowColor = col;
  ctx.fill();

  ctx.restore();
  requestAnimationFrame(animar);
}
animar();
setInterval(refrescar, 600);
refrescar();
</script>
</body>
</html>
